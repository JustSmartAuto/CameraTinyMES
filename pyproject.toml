[project]
name = "camera-tiny-mes"
version = "26.11.13.1"
description = "Cognex In-Sight 迷你MES系统（CogSocket 订阅 + SQLite/xlsx 落库 + 趋势图表）"
requires-python = ">=3.13"
dependencies = [
    "websockets>=15",
    "openpyxl>=3.1",
    "matplotlib>=3.10",
    "pillow>=10",
    "pymysql>=1.1",
    "pywebview>=6.2.1",
    "reportlab>=4.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6",
]

[project.scripts]
camera-tiny-mes = "cameratinymes.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
